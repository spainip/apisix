apiVersion: batch/v1
kind: Job
metadata:
  name: api-gateway-apisix-bootstrap
  namespace: apisix
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-admin-credentials
                  key: admin
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-gateway-demo-key
                  key: key
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              admin_url="http://apisix-admin:9180/apisix/admin"
              auth_header="X-API-KEY: ${APISIX_ADMIN_KEY}"

              until curl -sS -o /dev/null -H "${auth_header}" "${admin_url}/routes/1"; do
                sleep 5
              done

              put() {
                curl -fsS -X PUT -H "${auth_header}" -H "Content-Type: application/json" "$1" --data "$2" >/dev/null
              }

              put "${admin_url}/upstreams/1" '{"name":"api-gw-test","type":"roundrobin","nodes":{"api-gw-test:80":1}}'

              put "${admin_url}/consumer_groups/basic" '{"desc":"Basic API consumers","plugins":{"limit-count":{"count":300,"time_window":60,"key":"consumer_name","key_type":"var","policy":"local","rejected_code":429,"show_limit_quota_header":true}}}'
              put "${admin_url}/consumer_groups/premium-tier" '{"desc":"Premium API consumers","plugins":{"limit-count":{"count":3000,"time_window":60,"key":"consumer_name","key_type":"var","policy":"local","rejected_code":429,"show_limit_quota_header":true}}}'

              put "${admin_url}/consumers/demo-basic" '{"username":"demo-basic","group_id":"basic"}'
              credential_json=$(printf '{"id":"demo-basic-key","plugins":{"key-auth":{"key":"%s"}}}' "${DEMO_API_KEY}")
              put "${admin_url}/consumers/demo-basic/credentials/demo-basic-key" "${credential_json}"

              put "${admin_url}/routes/1" '{"name":"api-public-v1","hosts":["api.spainip.es"],"uris":["/healthz","/v1/hello","/openapi.json","/docs","/docs/*"],"methods":["GET"],"upstream_id":"1","plugins":{"limit-count":{"count":60,"time_window":60,"key":"remote_addr","key_type":"var","policy":"local","rejected_code":429,"show_limit_quota_header":true}}}'
              put "${admin_url}/routes/2" '{"name":"api-authenticated-v1","hosts":["api.spainip.es"],"uris":["/v1/items","/v1/echo"],"upstream_id":"1","plugins":{"key-auth":{"header":"apikey","query":"key"},"limit-count":{"count":300,"time_window":60,"key":"consumer_name","key_type":"var","policy":"local","rejected_code":429,"show_limit_quota_header":true}}}'
