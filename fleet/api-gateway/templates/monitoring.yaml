apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-gateway-alerts
  namespace: apisix
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: api-gateway
spec:
  groups:
    - name: api-gateway.apisix
      rules:
        - alert: ApisixHigh5xxRate
          expr: sum(rate(apisix_http_status{code=~"5.."}[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: APISIX is returning elevated 5xx responses
            description: APISIX is returning more than 0.1 5xx responses per second for 10 minutes.
        - alert: ApisixHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(apisix_http_latency_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: APISIX p95 latency is above one second
            description: The APISIX request latency p95 has exceeded one second for 10 minutes.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-apisix-dashboard
  namespace: cattle-monitoring-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: api-gateway
data:
  api-gateway-apisix.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "type": "stat",
          "title": "Requests / second",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(apisix_http_status[5m]))", "legendFormat": "requests/s" }
          ]
        },
        {
          "type": "stat",
          "title": "5xx / second",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "targets": [
            { "expr": "sum(rate(apisix_http_status{code=~\"5..\"}[5m]))", "legendFormat": "5xx/s" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p95",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 4 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(apisix_http_latency_bucket[5m])))", "legendFormat": "p95" }
          ]
        }
      ],
      "schemaVersion": 39,
      "title": "APISIX API Gateway",
      "version": 1
    }
